<!DOCTYPE html>
<html>
<head>
<title>My Profile Page</title>
<style>
body {
    font-family: Arial;
    background: #eef7ff;
    text-align: center;
}
h2 {
    background: #34495e;
    color: white;
    padding: 20px;
}
.card {
    background: white;
    width: 280px;
    height: 300px;
    margin: 40px auto;
    padding: 25px;
    border: 1px solid #ddd;
    border-radius: 20px;
    box-shadow: 0 4px 10px #ccc;
    overflow-y: auto;
}
.avatar {
    background: skyblue;
    color: white;
    border-radius: 50%;
    width: 90px;
    height: 90px;
    line-height: 90px;
    font-size: 30px;
    margin: auto;
}
p { color: gray; }
</style>
</head>
<body>

<h2>My Profile Page</h2>

<div class="card">
    <div class="avatar">DR</div>
    <h1>Dharmesh Rajpoot</h1>
    <h3>B.Tech CSE Student</h3>
    <p>
        Hi! I love coding and learning HTML, CSS, C and Python.
        I enjoy creating websites and exploring new technologies.
        My goal is to become a skilled web developer.
    </p>
</div>

</body>
</html>4
